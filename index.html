<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./media/css/styles.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" type="image/png" sizes="16x16" href="./media/images/others/favicon-16x16.png">
    <title>ER5</title>
    
</head>
<body>
    <audio id="gameMusic">
        <source src="./media/sounds/music/tavern.mp3" type="audio/mpeg">
    </audio>
    <audio id="attack">
        <source src="./media/sounds/sfx/swing.mp3" type="audio/mpeg">
    </audio>
    <audio id="critical">
        <source src="./media/sounds/sfx/swing2.mp3" type="audio/mpeg">
    </audio>
    <audio id="blunt">
        <source src="./media/sounds/sfx/miss.mp3" type="audio/mpeg">
    </audio>
    <audio id="melee">
        <source src="./media/sounds/sfx/punch.mp3" type="audio/mpeg">
    </audio>
    <audio id="melee_crit">
        <source src="./media/sounds/sfx/punch2.mp3" type="audio/mpeg">
    </audio>
    <audio id="equip">
        <source src="./media/sounds/sfx/equip_armor.mp3" type="audio/mpeg">
    </audio>
    <audio id="movement">
        <source src="./media/sounds/sfx/foot_steps.mp3" type="audio/mpeg">
    </audio>
    <audio id="fireball">
        <source src="./media/sounds/sfx/fireball.mp3" type="audio/mpeg">
    </audio>
    <audio id="buff">
        <source src="./media/sounds/sfx/buff.mp3" type="audio/mpeg">
    </audio>
    <audio id="curse">
        <source src="./media/sounds/sfx/curse.mp3" type="audio/mpeg">
    </audio>
    <audio id="dead">
        <source src="./media/sounds/sfx/dead.mp3" type="audio/mpeg">
    </audio>
    <audio id="draw">
        <source src="./media/sounds/sfx/draw_card.mp3" type="audio/mpeg">
    </audio>

    <div id="overlay" class="overlay"></div>
    <canvas id="gameScreen" width="1920" height="1080">
        Your browser does not support the HTML5 canvas tag
    </canvas>

    <section hidden id="login">
        <h2>Login</h2>
        <div class="input-box">
            <input id="email" type="email" name="email" value="" placeholder="Email">
            <i class='bx bx-envelope' ></i>
        </div>
        <div class="input-box">
            <input id="password" type="password" name="password" value="" placeholder="Password">
            <i class='bx bxs-lock-alt' ></i>
        </div>
        <div id="error-message">
            <div class="error" id="error">
                <i class='bx bx-error'></i>
            </div>
        </div>
        <button id = "enterLogin" class="btn">Login</button>
        <!-- <button id = "goToRegister" class="btn" onclick="goToRegister()">If you don't have acount go to register</button> -->
        <div class="register-link">
            <p>don't have an account?</p><a id="goToRegister">register</a>
        </div>
    </section>

    <section hidden id="register">
        <h2>Register</h2>
        <div class="input-box">
            <input id="email_register" type="email" name="email" value="" placeholder="Email">
            <i class='bx bx-envelope' ></i>
        </div>
        <div class="input-box">
            <input id="user_register" type="user" name="user" value="" placeholder="User">
            <i class='bx bxs-user'></i>
        </div>
        <div class="input-box">
            <input id="password_register" type="password" name="password" value="" placeholder="Password">
            <i class='bx bxs-lock-alt' ></i>
        </div>
        <div class="input-box">
            <input id = "password_confirm" type="password" name="password2" placeholder="Confirm password">
            <i class='bx bxs-lock-alt' ></i>
        </div>
        <div id="error-message-register">
            <div class="error" id="error-register">
               
            </div>
        </div>
        <button id = "enterRegister" class="btn" >Register</button>
    </section>

    <div hidden id="caja">
        <div id="user-data">
            <i class='bx bxs-user-circle'></i>
        </div>
        <div class="idioma">
            <label for="languages">Languages: </label>
            <select name="languages" id="languages" required>
                <option value="" selected="selected">Select your Language</option>
                <option value="0">ENGLISH</option>
                <option value="1">EUSKERA</option>
            </select>
        </div>
        <div class="player_list">
            <label for="player_list">Players:</label>
            <select hidden id="player_list" name="player_list" required>
                <option  value="" selected="selected">Select your Opponent</option>
            </select>
        </div>
       
        <!-- <button hidden id="Logout"  class="btn-lobby" >Log Out</button> -->
        <div class="buttons">
            <button hidden id="btnPlay" class="btn-lobby" >Start Game</button>
            <button hidden id="stats" class="btn-lobby" >Stats</button>
        </div>
        <div class="logout">
            <a id="Logout">Log Out</a>
        </div>
    </div>
  
    <div hidden id="statsDiv" class="statsDiv">
            <div hidden id="win" class="statsDiv">
                <p hidden class="title"> Win/Loses</p>
                <canvas hidden id="winRate" ></canvas>
            </div>

            <div hidden id="hit" class="statsDiv">
                <p hidden class="title"> Hit Types</p>
                <canvas hidden id="hitStats" ></canvas>
            </div>

            <div hidden id="dmg" class="statsDiv">
                <p hidden class="title"> Damages</p>
                <canvas hidden id="damageStats"></canvas>
            </div>

            <div hidden id ="games"class="statsDiv">
                <p hidden class="title"> VS. Players</p>
                <div id = "content">

                </div>
            </div>

            <div hidden id ="returnDiv" class="statsDiv">
                <button hidden id = "returnBtn"> Return </button>
            </div>
    </div>



<script type="module" src="./src/gameIndex.js"></script>
<script type="module" src="./src/changePage.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

</html>
